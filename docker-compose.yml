version: '3'
services:
  dbt:
    build:
      context: .
      dockerfile: Dockerfile
      target: dbt-bigquery
    image: dbt/bigquery
    working_dir: /usr/app/transformation
    volumes:
      - .:/usr/app
      - ./Airflow/credentials/google_credentials.json:/Airflow/credentials/google_credentials.json
      - /var/run/docker.sock:/var/run/docker.sock # include this line to allow the container to access the Docker daemon

    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /Airflow/credentials/google_credentials.json
    network_mode: host
